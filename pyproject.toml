[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmontage"
version = "0.1.0"
description = "AI-Orchestrated Video Production Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jsonschema>=4.20",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "numpy>=1.24",
    "requests>=2.31",
    "filelock>=3.13",
    "google-auth>=2.0",
    "google-genai>=1.0.0",
    "openai>=2.44.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "watchfiles>=0.21",
    # Imported by the manifest-faithful narration path and the internal
    # teaching/demo runner; keep the baseline install self-contained.
    "edge-tts>=7.2.0",
]

[project.optional-dependencies]
dev = [
    "setuptools>=69",
    "wheel>=0.45",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.24",
    "tomli>=2.0; python_version < '3.11'",
]
gpu = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "torchvision>=0.15",
    "diffusers>=0.30",
    "transformers>=4.40",
    "accelerate>=0.30",
]

[tool.setuptools.packages.find]
include = [
    "backlot*",
    "config*",
    "content_templates*",
    "lib*",
    "pipeline_defs*",
    "profiles*",
    "schemas*",
    "skills*",
    "styles*",
    "tools*",
]

[tool.setuptools.package-data]
"backlot" = ["ui/**/*"]
"config" = ["*.json", "*.yaml", "*.yml"]
"content_templates" = ["*.yaml", "*.yml", "*.json"]
"pipeline_defs" = ["*.yaml", "*.yml"]
"profiles" = ["*.yaml", "*.yml", "*.json"]
"schemas" = ["**/*.json", "**/*.yaml", "**/*.yml"]
"skills" = ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.json"]
"styles" = ["*.yaml", "*.yml", "*.json"]
"tools" = ["_comfyui/workflows/**/*", "video/vendor/**/*"]

# These release assets are shared by the Python tools and the Remotion
# composer.  ``lib.paths.resource_path`` resolves them from the source root or
# the conventional wheel install prefix at runtime.
[tool.setuptools.data-files]
"." = ["config.yaml"]
"remotion-composer" = [
    "remotion-composer/package.json",
    "remotion-composer/package-lock.json",
    "remotion-composer/tsconfig.json",
    "remotion-composer/SCENE_TYPES.md",
    "remotion-composer/titled_video_props.json",
]
"remotion-composer/src" = [
    "remotion-composer/src/*.tsx",
    "remotion-composer/src/*.ts",
    "remotion-composer/src/*.json",
]
"remotion-composer/src/cinematic" = ["remotion-composer/src/cinematic/*.tsx", "remotion-composer/src/cinematic/*.ts"]
"remotion-composer/src/components" = ["remotion-composer/src/components/*.tsx", "remotion-composer/src/components/*.ts"]
"remotion-composer/src/components/charts" = ["remotion-composer/src/components/charts/*.tsx", "remotion-composer/src/components/charts/*.ts"]
"remotion-composer/src/lib" = ["remotion-composer/src/lib/*.tsx", "remotion-composer/src/lib/*.ts", "remotion-composer/src/lib/*.json"]
# Curated, tracked demo props are safe to ship.  User footage, downloaded
# stock, generated project media, and per-run caption props are runtime inputs
# and must never enter a wheel merely because they exist in a dirty checkout.
"remotion-composer/public/demo-props" = [
    "remotion-composer/public/demo-props/code-to-screen.json",
    "remotion-composer/public/demo-props/focusflow-pitch.json",
    "remotion-composer/public/demo-props/world-in-numbers.json",
]
